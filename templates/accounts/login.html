<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Login to SwapMe" />
        <meta name="author" content="" />
        <title>Login - SwapMe</title>
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                background: #ffeda2;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .login-container {
                background: transparent;
                border-radius: 10px;
                width: 100%;
                max-width: 450px;
                padding: 40px;
            }
            .login-header {
                text-align: center;
                margin-bottom: 40px;
            }
            .logo-container {
                margin-bottom: 30px;
                display: flex;
                justify-content: center;
            }
            .logo-container img {
                max-width: 280px;
                height: auto;
                border-radius: 10px;
            }
            .login-header h1 {
                color: white;
                font-weight: 700;
                margin-bottom: 10px;
                font-size: 2rem;
                display: none;
            }
            .login-header p {
                color: #333;
                margin: 0;
                font-size: 1.2rem;
                font-weight: 500;
            }
            .form-group {
                margin-bottom: 20px;
            }
            .form-label {
                font-weight: 600;
                color: #333;
                margin-bottom: 8px;
                display: block;
            }
            .form-control {
                border: 2px solid #ddd;
                border-radius: 5px;
                padding: 12px 15px;
                font-size: 1rem;
                transition: border-color 0.3s ease;
                background: white;
                color: #333;
            }
            .form-control::placeholder {
                color: #999;
            }
            .form-control:focus {
                border-color: #FFA500;
                box-shadow: 0 0 0 0.2rem rgba(255, 165, 0, 0.25);
                background: white;
                color: #333;
            }
            .btn-login {
                background: white;
                border: none;
                color: #FFA500;
                font-weight: 600;
                padding: 12px 20px;
                border-radius: 5px;
                width: 100%;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .btn-login:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
                color: #FFA500;
            }
            .btn-login:active {
                transform: translateY(0);
            }
            .alert {
                border-radius: 5px;
                margin-bottom: 20px;
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                color: #721c24;
                animation: slideInLeft 0.3s ease-out;
            }
            @keyframes slideInLeft {
                from {
                    transform: translateX(-300px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            .alert-danger {
                color: #721c24;
            }
            .btn-close {
                filter: none;
            }
            .demo-credentials {
                background: rgba(255, 255, 255, 0.5);
                border: 1px solid #ddd;
                border-radius: 5px;
                padding: 15px;
                margin-top: 20px;
                font-size: 0.9rem;
                color: #333;
                display: none;
            }
            .demo-credentials.show {
                display: block;
            }
            .demo-credentials strong {
                color: #333;
            }
            .forgot-password {
                text-align: center;
                margin-top: 15px;
            }
            .forgot-password a {
                color: #FFA500;
                text-decoration: none;
                font-weight: 600;
                cursor: pointer;
            }
            .forgot-password a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="login-header">
                <div class="logo-container">
                    <img src="/media/SwapMeLogo.jpg" alt="SwapMe Logo">
                </div>
                <p>Sign in to your account</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username" 
                        value="{{ username }}"
                        required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required>
                </div>

                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>

                <div class="forgot-password">
                    <a onclick="toggleCredentials()">Forgot Password?</a>
                </div>
            </form>

            <div class="demo-credentials" id="demoCredentials">
                <strong><i class="bi bi-info-circle"></i> Demo Credentials:</strong><br>
                Username: <strong>SwapMeTester</strong><br>
                Password: <strong>Tester2025!</strong>
            </div>
        <script>
            function toggleCredentials() {
                const credBox = document.getElementById('demoCredentials');
                credBox.classList.toggle('show');
            }
        </script>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
